      const hold = lit !== null;
      const r = hold ? Math.floor(lit / 8) : 0;
      const c = hold ? lit % 8 : 0;
      for (let n = 0; n < buttons.length; n++) {
        const el = buttons[n];
        const rr = Math.floor(n / 8), cc = n % 8;
        const close = hold && Math.abs(rr - r) <= 1 && Math.abs(cc - c) <= 1 && n !== lit;
        el.classList.toggle("hot", hold && n === lit);
        el.classList.toggle("near", close);
        el.classList.toggle("cursor", n === cursor);
      }
    }
    function ripple() {
      for (let n = 0; n < buttons.length; n++) {
        const delay = (Math.floor(n / 8) + (n % 8)) * 28;
        window.setTimeout(() => {
          buttons[n].classList.add("wave");
          window.setTimeout(() => buttons[n].classList.remove("wave"), 220);
        }, delay);
      }
    }
    function celebrate(kind) {
      slab.classList.add(kind);
      window.clearTimeout(eggTimer);
      eggTimer = window.setTimeout(() => slab.classList.remove(kind), 3200);
    }
    function save() {
      try { localStorage.setItem(STORE, JSON.stringify({ voice: voiceName })); } catch (e) {}
    }
    function toggleArm() {
      heard = true;
      started = true;
      armed = !armed;
      paintArm();
      if (!armed) {
        talkToken += 1;
        if (window.speechSynthesis) {
          try { window.speechSynthesis.cancel(); } catch (e) {}
        }
        show("MUTED", "Muted. Tap ARM to hear the keys.");
      } else {
        show("ARMED", spaceOn ? "Armed. A Space hears this Mac output." : "Armed. Tap a key.");
        talk("Armed.", voiceName);
      }
    }
    function toggleSpace() {
      spaceOn = !spaceOn;
      paintSpace();
      show(spaceOn ? "IN SPACE" : "DESK", spaceOn ? "Point the Space mic at this Mac output. BlackHole or Loopback." : "Desk mode. Tap a key.");
    }
    function cycleVoice() {
      const i = VOICES.indexOf(voiceName);
      voiceName = VOICES[(i + 1) % VOICES.length];
      save();
      paintVoice();
      show("VOICE", voiceName);
      if (armed) talk(voiceName + ".", voiceName);
    }
    function pokeIdle() {
      started = true;
      window.clearTimeout(idleTimer);
      idleTimer = window.setTimeout(stepIdle, 7000);
    }
    function stepIdle() {
      if (buffer.length || slab.classList.contains("egg") || slab.classList.contains("night") || !started) {
        idleTimer = window.setTimeout(stepIdle, 1000);
        return;
      }
      const rows = [
        ["COOK", "Sixty-four keys. Arrow keys walk. Enter presses."],
        ["ORDER", "Ship, then green, then cook. The lamp counts."],
        ["SPACE", spaceOn ? "Point the Space mic at this Mac output." : "Space mode is how a room hears the clip."]
      ];
      const row = rows[idleN % rows.length];
      show(row[0], row[1]);
      idleN += 1;
      idleTimer = window.setTimeout(stepIdle, 4200);
    }
    function secret(hit) {
      show(hit.name, hit.show);
      talk(hit.say, hit.voice);
    }
    function press(i) {
      cursor = i;
      lit = i;
      paint();
      if (!heard) {
        heard = true;
        armed = true;
        paintArm();
      }
      const result = feed(i);
      armHold();
      played.add(i);
      if (result.egg) {
        secret(result.egg);
        ripple();
        celebrate("egg");
      } else {
        show(armed ? "SAYS" : "MUTED", KEYS[i].show);
        talk(KEYS[i].say, voiceName);
      }
      if (!served && played.size === 64 && !result.egg) {
        served = true;
        secret(SERVICE);
        ripple();
        celebrate("egg");
      }
      pokeIdle();
    }
    let cells = "";
    for (let i = 0; i < KEYS.length; i++) {
      const k = KEYS[i];
      cells += '<button type="button" class="key" data-i="' + i + '" style="--h:' + k.hue + '" aria-label="' + k.code + ". " + k.show + '"><i class="led" aria-hidden="true"></i><b>' + k.code + '</b></button>';
    }
    keysEl.innerHTML = cells;
    for (let i = 0; i < KEYS.length; i++) buttons.push(keysEl.children[i]);
    paint();
    keysEl.addEventListener("click", (ev) => {
      const el = ev.target.closest("button");
      if (!el || el.dataset.i == null) return;
      press(el.dataset.i | 0);
    });
    armBtn.addEventListener("click", toggleArm);
    cutBtn.addEventListener("click", cut);
    voiceBtn.addEventListener("click", cycleVoice);
    spaceBtn.addEventListener("click", toggleSpace);
    window.addEventListener("keydown", (ev) => {
      if (ev.metaKey || ev.ctrlKey || ev.altKey || ev.repeat) return;
      const token = ev.key.length === 1 ? ev.key.toLowerCase() : ev.key;
      if (token === " " || token === "Escape") {
        ev.preventDefault();
        cut();
        return;
      }
      if (token === "ArrowLeft" || token === "ArrowRight" || token === "ArrowUp" || token === "ArrowDown") {
        ev.preventDefault();
        const col = cursor % 8, row = Math.floor(cursor / 8);
        if (token === "ArrowLeft") cursor = row * 8 + (col + 7) % 8;
        if (token === "ArrowRight") cursor = row * 8 + (col + 1) % 8;
        if (token === "ArrowUp") cursor = ((row + 7) % 8) * 8 + col;
        if (token === "ArrowDown") cursor = ((row + 1) % 8) * 8 + col;
        paint();
      }
      if (token === "Enter") {
        if (ev.target && ev.target.tagName === "BUTTON") return;
        ev.preventDefault();
        press(cursor);
      }
      const word = follow(wordBuf, WORD.seq, token);
      wordBuf = word.buf;
      if (word.hit) {
        secret(WORD);
        ripple();
        celebrate("egg");
      }
      const night = follow(nightBuf, NIGHT.seq, token);
      nightBuf = night.buf;
      if (night.hit) {
        secret(NIGHT);
        celebrate("night");
      }
    });
    try {
      const saved = JSON.parse(localStorage.getItem(STORE) || "{}");
      if (VOICES.indexOf(saved.voice) !== -1) voiceName = saved.voice;
    } catch (e) {}
    paintVoice();
    paintArm();
    paintSpace();
    if (window.speechSynthesis) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.addEventListener("voiceschanged", paintVoice);
    }
  })();
  </script>
</body>
